<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Gestió mèdica familiar</title>
  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --line:#dfe5ef;
      --text:#1f2937;
      --muted:#6b7280;
      --danger:#fee2e2;
      --dangerText:#b91c1c;
      --soft:#f3f4f6;
      --softText:#374151;
      --primary:#111827;
      --primaryText:#ffffff;
      --accent:#eef2ff;
      --accentText:#3730a3;
    }

    * { box-sizing:border-box; }

    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    .wrap{
      max-width:1500px;
      margin:0 auto;
      padding:16px;
    }

    h1{
      margin:0 0 8px;
      font-size:1.8rem;
    }

    .sub{
      color:var(--muted);
      margin-bottom:18px;
    }

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      box-shadow:0 4px 14px rgba(0,0,0,.05);
    }

    .form-card{
      padding:16px;
      margin-bottom:18px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(12, 1fr);
      gap:12px;
    }

    .field{
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    .field label{
      font-size:.88rem;
      color:var(--muted);
      font-weight:600;
    }

    .field input,
    .field select,
    .field textarea{
      width:100%;
      border:1px solid var(--line);
      border-radius:12px;
      padding:10px 12px;
      font-size:.95rem;
      background:#fff;
      color:var(--text);
    }

    .field textarea{
      min-height:92px;
      resize:vertical;
    }

    .span-2{grid-column:span 2}
    .span-3{grid-column:span 3}
    .span-4{grid-column:span 4}
    .span-6{grid-column:span 6}
    .span-12{grid-column:span 12}

    .inline-tools{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:6px;
    }

    .row-actions{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:14px;
    }

    button{
      border:none;
      border-radius:12px;
      padding:10px 14px;
      font-size:.92rem;
      font-weight:700;
      cursor:pointer;
    }

    .btn-primary{ background:var(--primary); color:var(--primaryText); }
    .btn-secondary{ background:var(--accent); color:var(--accentText); }
    .btn-soft{ background:var(--soft); color:var(--softText); }
    .btn-danger{ background:var(--danger); color:var(--dangerText); }

    .top-tools{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      justify-content:space-between;
      align-items:center;
      padding:14px 16px;
      border-bottom:1px solid var(--line);
    }

    .table-wrap{
      overflow:auto;
      -webkit-overflow-scrolling:touch;
    }

    table{
      width:100%;
      border-collapse:collapse;
      min-width:1600px;
      background:#fff;
    }

    th,td{
      padding:10px 12px;
      border-bottom:1px solid var(--line);
      text-align:left;
      vertical-align:top;
      font-size:.92rem;
    }

    th{
      position:sticky;
      top:0;
      background:#f8fafc;
      z-index:1;
      font-size:.82rem;
      text-transform:uppercase;
      letter-spacing:.03em;
      color:#475569;
    }

    .center{text-align:center}
    .right{text-align:right}
    .small{font-size:.82rem}
    .muted{color:var(--muted)}
    .price{font-weight:700}
    .ok{color:#15803d;font-weight:700}
    .no{color:#9ca3af}

    .empty{
      padding:24px;
      text-align:center;
      color:var(--muted);
    }

    .hint{
      margin-top:8px;
      color:var(--muted);
      font-size:.82rem;
    }

    .mark{
      display:inline;
      padding:0 2px 2px;
      border-bottom-width:8px;
      border-bottom-style:solid;
      border-radius:4px;
      font-weight:700;
      line-height:1.8;
      background:linear-gradient(to top, var(--mark-color) 0 55%, transparent 55% 100%);
    }

    .pill{
      display:inline-block;
      padding:4px 8px;
      border-radius:999px;
      font-weight:700;
      font-size:.8rem;
      background:#f3f4f6;
      color:#374151;
      white-space:nowrap;
    }

    dialog{
      border:none;
      border-radius:18px;
      width:min(560px, calc(100vw - 24px));
      padding:0;
      box-shadow:0 18px 60px rgba(0,0,0,.2);
    }

    dialog::backdrop{
      background:rgba(15,23,42,.35);
    }

    .modal-head{
      padding:16px 18px;
      border-bottom:1px solid var(--line);
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .modal-body{ padding:16px 18px; }
    .modal-foot{
      padding:16px 18px;
      border-top:1px solid var(--line);
      display:flex;
      gap:10px;
      justify-content:flex-end;
      flex-wrap:wrap;
    }

    .manager-list{
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-top:14px;
      max-height:280px;
      overflow:auto;
    }

    .manager-item{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      border:1px solid var(--line);
      border-radius:12px;
      padding:10px 12px;
      background:#fff;
    }
